# ============================================================================
# NIPON CI/CD — docker-compose
#
# Brings up:
#   * jenkins     — the CI/CD controller (builds, tests, quality-gates, deploys NIPON)
#   * sonarqube   — static analysis + code coverage quality gate
#   * sonar-db    — Postgres metadata store for SonarQube
#
# Jenkins runs privileged and mounts the Docker socket so the pipeline can
# build + push the NIPON service images to the local registry (.120) and so
# agents can use the host Docker daemon.
#
# Usage:
#   cp .env.sample .env        # fill in REGISTRY / k3s node / credentials
#   docker compose up -d
#   # jenkins  -> http://<host>:8080   (admin/admin until you change it)
#   # sonar    -> http://<host>:9000   (admin/admin)
#
# See README.md for the full pipeline + trigger design.
# ============================================================================

services:
  jenkins:
    image: jenkins/jenkins:lts-jdk21
    hostname: jenkins
    container_name: nippon-jenkins
    restart: unless-stopped
    privileged: true                      # lets the build agent drive the host Docker daemon
    user: root
    build: .
    group_add:
      - "1001"                           # jenkins user joins the host docker group -> socket access
    ports:
      - "8080:8080"                       # Jenkins web UI + /github-webhook/
      - "50000:50000"                     # Jenkins agent (JNLP) tunnel
    environment:
      JENKINS_HOME: /var/jenkins_home
      JENKINS_ADMIN_PASSWORD: "admin"          # admin/admin until first login (change it!)
      JAVA_OPTS: "-Duser.timezone=America/Sao_Paulo -Dhudson.model.DirectoryBrowserSupport.CSP="
      TZ: "America/Sao_Paulo"
      # Pipeline inputs (consumed by the Jenkinsfile; secrets come from .env)
      NIPON_REPO_URL: ${NIPON_REPO_URL:-https://github.com/kmoreti/nippon.git}
      NIPON_REF: ${NIPON_REF:-main}
      NIPON_GH_TOKEN: ${GITHUB_TOKEN:-}
      SONAR_HOST: http://sonarqube:9000
      SONAR_TOKEN: ${SONAR_TOKEN:-}
      K3S_NODE: ${K3S_NODE:-kmoreti@192.168.68.129}
      K3S_SSH_KEY: /home/jenkins/.ssh/id_ed25519   # working key to the k3s node
      KUBECTL_CONFIG: /home/jenkins/.kube/config
      # Build toolchain (NIPON needs JDK 27 + Maven 3.9; the host has both)
      NIPON_JAVA_HOME: /opt/jdk27
      NIPON_MAVEN_HOME: /opt/maven
      K3S_NAMESPACE: ${K3S_NAMESPACE:-nippon}
      REGISTRY: ${REGISTRY:-192.168.68.120:5000}
      DEPLOY: ${DEPLOY:-true}
      # From inside the Jenkins container the bridge gateway Testcontainers
      # auto-detects (172.17.0.1) isn't where the published ports land, so the
      # @ServiceConnection JDBC URL is refused. host.docker.internal reaches the
      # host's published ports from inside the container.
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
    volumes:
      - jenkins_home:/var/jenkins_home
      # Bootstrap on first boot (the ref dir is copied into jenkins_home once)
      - ./jenkins/init.groovy:/usr/share/jenkins/ref/init.groovy.d/init.groovy:ro
      - ./jenkins/jobs/nippon-cicd/config.xml:/opt/nippon/jobs/nippon-cicd/config.xml:ro
      # Host Docker daemon so the pipeline can `docker build`/`docker push`
      - /var/run/docker.sock:/var/run/docker.sock
      # Host Docker CLI (the jenkins image has no docker binary; mount the host's)
      - /mnt/wsl/docker-desktop/cli-tools/usr/bin/docker:/opt/docker-cli/docker:ro
      # Shared workspace so the controller sees the host Maven cache + k3s creds
      - ${HOME:-/home/kmoreti}/.m2:/home/jenkins/.m2
      # Build toolchain: NIPON needs JDK 27 + Maven 3.9 (host has both)
      - ${HOME:-/home/kmoreti}/.jdks/jdk-27.0.1.0.2+1:/opt/jdk27:ro
      - ./maven-official/apache-maven-3.9.9:/opt/maven:ro
      - ./jenkins/kubeconfig:/home/jenkins/.kube/config:ro
      # Deploy SSH key that actually authenticates to the k3s node
      - ${HOME:-/home/kmoreti}/.ssh/id_ed25519:/home/jenkins/.ssh/id_ed25519:ro
      - ./jenkins/id_rsa:/home/jenkins/.ssh/id_rsa:ro
      - ./jenkins/id_rsa.pub:/home/jenkins/.ssh/id_rsa.pub:ro
    networks:
      - cicd

  sonarqube:
    image: sonarqube:lts-community
    container_name: nippon-sonarqube
    restart: unless-stopped
    depends_on:
      - sonar-db
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:-sonarpass}
      SONAR_ES_SECURITY_ENABLED: "false"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - cicd

  sonar-db:
    image: postgres:16
    container_name: nippon-sonar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:-sonarpass}
      POSTGRES_DB: sonar
    volumes:
      - sonar_db:/var/lib/postgresql/data
    networks:
      - cicd

networks:
  cicd:
    driver: bridge

volumes:
  jenkins_home:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonar_db:
